site_url: https://tinscarecrow.com
display_url: https://tinscarecrow.com

backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:

  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    filter: { field: "type", value: "blog" }
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Type", name: "type", widget: "hidden", default: "blog" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "recipes"
    label: "Recipes"
    folder: "src/content/blog"
    create: true
    filter: { field: "type", value: "recipe" }
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Type", name: "type", widget: "hidden", default: "recipe" }
      - { label: "Body", name: "body", widget: "markdown" }